# doc/LIVE-LOGIN-RELAY-SPEC.md §12. Свой файл, НЕ тот же, что
# docker-compose.yml/docker-compose.dev.yml корня монорепо — у сервиса
# нет ни Postgres, ни зависимостей от остальных сервисов проекта.
# Импортируется в Dokploy как есть (doc/CLIENT-SITE-TUTORIAL-SPEC.md
# §7.4.9).

services:
  live-login-relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8088
      - LIVE_LOGIN_RELAY_SECRET=${LIVE_LOGIN_RELAY_SECRET}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-10}
      - SESSION_WALL_TIMEOUT_MS=${SESSION_WALL_TIMEOUT_MS:-180000}
      - SESSION_IDLE_TIMEOUT_MS=${SESSION_IDLE_TIMEOUT_MS:-60000}
      - RESULT_CACHE_MS=${RESULT_CACHE_MS:-60000}
      - WS_AUTH_TIMEOUT_MS=${WS_AUTH_TIMEOUT_MS:-5000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - '8088:8088'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Headless Chromium под --no-sandbox обходится дефолтным /dev/shm
    # маленького контейнера не всегда гладко при заметном числе
    # одновременных сессий (типовая проблема Chromium в Docker) — при
    # необходимости раскомментировать:
    # shm_size: '512mb'
