<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig executor ffmpeg-server (FONTCONFIG_FILE). Лежит в образе —
  на read-only корневой ФС; кеш — во временном tmpfs. Доп. шрифты — с
  read-only volume /usr/local/share/fonts/extra.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir>/usr/local/share/fonts/extra</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <!--
    Команды продуктов (ASS force_style, drawtext) ссылаются на Arial; в
    образе его нет (несвободный шрифт). Явный алиас на DejaVu Sans с
    кириллицей и украинским — вместо случайной подстановки fontconfig.
  -->
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
