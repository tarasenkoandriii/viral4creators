# gitleaks — поиск секретов в коммитах (П-К1, Р-З10-6; джоба `secrets` в
# .github/workflows/ci.yml). Правила — встроенные в бинарник (версия
# закреплена в ci.yml), здесь только исключения.
#
# Принцип исключений: в тестах и фикстурах полно ПОДДЕЛЬНЫХ ключей
# (`whsec_…`, `sk_live_0123…`, самоподписанные TLS-ключи стендов), и два
# правила там дают только шум: `generic-api-key` (любая строка рядом со
# словом key/secret/token) и `private-key` (PEM-ключи самоподписанных
# сертификатов стендов `testing/*.testing.ts`) — в тестах и фикстурах они
# выключены целиком. `stripe-access-token` в тестах НЕ выключен: две
# подделки `sk_live_…` (тест вычистки ключа из текста ошибки и тест отказа
# секретному ключу вместо публичного) исключены по точному значению ниже —
# настоящий ключ провайдера платежей в спеке ловится. Так же действуют и
# все прочие правила под формат провайдера (AWS, GitHub, Telegram, Google,
# OpenAI, Anthropic, …). Вне тестов — исключения только точечные, по
# значению, с причиной.
#
# Находка в CI (аннотация «gitleaks <правило> … отпечаток …»):
#  1. Подделка (тестовое значение) — комментарий `gitleaks:allow` в той же
#     строке; повторяющийся класс — запись сюда, с причиной.
#  2. Настоящий секрет — он УЖЕ опубликован пушем (приватность и удаление
#     коммита его не отзывают): сначала РОТИРОВАТЬ у провайдера (новый
#     ключ → env Vercel/Dokploy → отозвать старый), потом убрать значение
#     из кода. Сюда его НЕ добавлять.
#  3. После ротации — отпечаток из аннотации (`<коммит>:<файл>:<правило>:
#     <строка>`) строкой в `.gitleaksignore` в корне, с комментарием «ротирован
#     ДД.ММ.ГГГГ». Без этого коммит с ключом остаётся в диапазоне джобы
#     `secrets` (база — последний УСПЕШНЫЙ прогон) и красит CI на каждом
#     пуше; переписывать историю не нужно.
#  Скан всей истории (Run workflow → secrets_history) — тот же порядок:
#  список из артефакта gitleaks-history → ротация → `.gitleaksignore`.

[extend]
useDefault = true

[[allowlists]]
description = "Тесты и фикстуры: поддельные ключи (только два шумных правила)"
targetRules = ["generic-api-key", "private-key"]
paths = [
  '''\.(?:spec|test|e2e-spec)\.[cm]?[jt]sx?$''',
  '''(?:^|/)testing/[^/]+\.testing\.ts$''',
  '''(?:^|/)(?:test|tests|e2e|__tests__|fixtures)/''',
]

[[allowlists]]
description = "Документы и код: известные не-секреты (точное значение)"
targetRules = ["generic-api-key"]
regexes = [
  # RFC 6455, пример ключа рукопожатия WebSocket («the sample nonce»).
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
  # doc/AUDIT-2026-09-07-round3.md цитирует подделки из notify.spec.ts.
  '''^AIzaSyC1234567890abcdefg$''',
  '''^abcdefgh12345678$''',
  # Имена заголовков в списке запрещённых (connector-exec.ts), не значения.
  '''^x-v4c-[a-z-]+$''',
]

[[allowlists]]
description = "Подделки sk_live_ в тестах (точное значение)"
targetRules = ["stripe-access-token"]
regexes = [
  # backend/src/common/unit-balance.spec.ts — вычистка ключа из ошибки.
  '''^sk_live_0123456789abcdef$''',
  # sites-landing/scripts/assist-env.test.ts — sk_ вместо pk_ отвергается.
  '''^sk_live_abcdefgh12$''',
]
