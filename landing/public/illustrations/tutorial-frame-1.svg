<!-- Кадр 1 «Вставили ссылку». Схема, не скриншот. Текста нет ни одного символа — см. docs-tz/TZ-Enterprise-Tutorial-Landing.md, этап D. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202026"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8098ff"/>
      <stop offset="1" stop-color="#5c7dff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- Дальний план: окно сайта ещё пустое — и это правда, сценарий не
       начался. Показано ожиданием (скелетон), а не отсутствием. -->
  <g opacity=".85">
    <rect x="90" y="36" width="660" height="212" rx="20" fill="#101014" stroke="#232329" stroke-width="3"/>
    <path d="M90 90H750" stroke="#232329" stroke-width="3"/>
    <circle cx="122" cy="63" r="7" fill="#9a9a9a" opacity=".3"/>
    <circle cx="146" cy="63" r="7" fill="#9a9a9a" opacity=".3"/>
    <circle cx="170" cy="63" r="7" fill="#9a9a9a" opacity=".3"/>
    <rect x="200" y="55" width="300" height="16" rx="8" fill="#9a9a9a" opacity=".14"/>
    <rect x="124" y="120" width="300" height="18" rx="9" fill="#9a9a9a" opacity=".13"/>
    <rect x="124" y="154" width="450" height="13" rx="6.5" fill="#9a9a9a" opacity=".1"/>
    <rect x="124" y="180" width="380" height="13" rx="6.5" fill="#9a9a9a" opacity=".1"/>
  </g>

  <!-- Ближний план: панель мастера перекрывает окно — адрес вводится
       здесь, сайт появится там. -->
  <g filter="url(#lift)">
    <rect x="140" y="196" width="620" height="320" rx="26" fill="url(#panel)" stroke="#3a3a42" stroke-width="3"/>
  </g>
  <rect x="140" y="196" width="620" height="320" rx="26" fill="url(#glass)"/>
  <rect x="180" y="224" width="170" height="14" rx="7" fill="#9a9a9a" opacity=".5"/>

  <!-- Поле адреса в фокусе: кольцо, вставленный адрес полосой (не
       выдуманным доменом) и акцентная каретка. -->
  <rect x="174" y="246" width="552" height="96" rx="22" fill="none" stroke="#6c8cff" stroke-width="6" opacity=".22"/>
  <rect x="180" y="252" width="540" height="84" rx="18" fill="#08080a" stroke="#6c8cff" stroke-width="4"/>
  <circle cx="218" cy="294" r="16" fill="none" stroke="#9a9a9a" stroke-width="4" opacity=".75"/>
  <path d="M202 294h32M218 278c8 8 8 24 0 32-8-8-8-24 0-32" fill="none" stroke="#9a9a9a" stroke-width="4" opacity=".75"/>
  <rect x="254" y="286" width="250" height="16" rx="8" fill="#ececec" opacity=".72"/>
  <rect x="520" y="272" width="6" height="44" rx="3" fill="#6c8cff"/>

  <rect x="180" y="356" width="540" height="78" rx="18" fill="url(#cta)" filter="url(#lift)"/>
  <rect x="375" y="387" width="150" height="16" rx="8" fill="#06060a" opacity=".8"/>

  <rect x="180" y="454" width="540" height="46" rx="14" fill="#0b0b0d" stroke="#2a2a30" stroke-width="3"/>
  <circle cx="212" cy="477" r="13" fill="none" stroke="#6c8cff" stroke-width="4"/>
  <path d="M212 471v7M212 483v1" stroke="#6c8cff" stroke-width="4" stroke-linecap="round"/>
  <rect x="242" y="470" width="300" height="14" rx="7" fill="#9a9a9a" opacity=".45"/>
</svg>
