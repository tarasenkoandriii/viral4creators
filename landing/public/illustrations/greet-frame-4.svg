<!-- Кадр 4 «Готовый ролик» (этап H ТЗ docs-tz/TZ-Greeting-2.0-Adaptive-Persona-Landing.md §5.3).
     Вертикальный плеер 9:16 по центру: праздничная сцена без людей и
     лиц (лица из пользовательских роликов на рекламе требуют отдельного
     согласия, §5.2), полоски субтитров, прогресс; позади — две соседние
     сцены того же ролика; справа — скачать и переслать. Ни букв, ни цифр. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="g4scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3358"/>
      <stop offset=".62" stop-color="#1a1d2e"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="g4side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20243a"/>
      <stop offset="1" stop-color="#121217"/>
    </linearGradient>
    <linearGradient id="g4cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8098ff"/>
      <stop offset="1" stop-color="#5c7dff"/>
    </linearGradient>
    <radialGradient id="g4glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="g4clip">
      <rect x="336" y="36" width="192" height="340" rx="18"/>
    </clipPath>
    <filter id="g4lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".6"/>
    </filter>
  </defs>
  <ellipse cx="432" cy="260" rx="320" ry="250" fill="url(#g4glow)"/>

  <!-- Дальний план: соседние сцены того же ролика. -->
  <g opacity=".55">
    <rect x="160" y="84" width="150" height="266" rx="16" fill="url(#g4side)" stroke="#26262c" stroke-width="3"/>
    <path d="M188 300h94v-40h-94z M182 260h106v-14h-106z M235 246v54" fill="none" stroke="#6c8cff" stroke-width="3" opacity=".6"/>
    <rect x="554" y="84" width="150" height="266" rx="16" fill="url(#g4side)" stroke="#26262c" stroke-width="3"/>
    <path d="M629 300c-22-15-34-26-34-39 0-9 7-17 17-17 7 0 13 4 17 9 4-5 10-9 17-9 10 0 17 8 17 17 0 13-12 24-34 39z" fill="none" stroke="#6c8cff" stroke-width="3" opacity=".6"/>
  </g>

  <!-- Передний план: плеер 9:16 (192×340 ≈ 9:16). -->
  <g filter="url(#g4lift)">
    <rect x="324" y="24" width="216" height="436" rx="28" fill="#17171c" stroke="#33333a" stroke-width="3"/>
  </g>
  <rect x="336" y="36" width="192" height="340" rx="18" fill="url(#g4scene)"/>
  <g clip-path="url(#g4clip)">
    <!-- Конфетти. -->
    <g fill="#6c8cff">
      <rect x="356" y="62" width="8" height="4" rx="2" transform="rotate(30 360 64)"/>
      <rect x="410" y="52" width="8" height="4" rx="2" transform="rotate(-20 414 54)"/>
      <rect x="486" y="70" width="8" height="4" rx="2" transform="rotate(45 490 72)"/>
      <circle cx="378" cy="96" r="3"/>
      <circle cx="504" cy="108" r="3"/>
    </g>
    <g fill="#ececec" opacity=".55">
      <rect x="452" y="58" width="7" height="3.5" rx="1.75" transform="rotate(60 455 60)"/>
      <circle cx="350" cy="130" r="2.5"/>
      <circle cx="470" cy="92" r="2.5"/>
    </g>
    <!-- Шары. -->
    <g fill="none" stroke="#8098ff" stroke-width="3.5">
      <ellipse cx="400" cy="160" rx="24" ry="30"/>
      <ellipse cx="452" cy="148" rx="24" ry="30"/>
      <path d="M400 190c-4 24 12 44 26 60 M452 178c2 28-12 50-26 72"/>
    </g>
    <ellipse cx="392" cy="150" rx="6" ry="9" fill="#ffffff" opacity=".14"/>
    <ellipse cx="444" cy="138" rx="6" ry="9" fill="#ffffff" opacity=".14"/>
    <!-- Стол и торт. -->
    <path d="M336 312h192" stroke="#3c3c46" stroke-width="3"/>
    <path d="M396 312v-34h72v34 M396 290h72" fill="none" stroke="#ececec" stroke-width="3" opacity=".45"/>
    <path d="M432 278v-14 M432 264c-5-6 0-11 0-14 4 5 6 9 0 14" fill="none" stroke="#6c8cff" stroke-width="3" stroke-linecap="round"/>
    <!-- Субтитры. -->
    <rect x="362" y="330" width="140" height="10" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="382" y="348" width="100" height="10" rx="5" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- Прогресс и кнопка воспроизведения. -->
  <rect x="344" y="394" width="176" height="6" rx="3" fill="#2a2a33"/>
  <rect x="344" y="394" width="104" height="6" rx="3" fill="#6c8cff"/>
  <circle cx="448" cy="397" r="7" fill="#ececec"/>
  <circle cx="432" cy="428" r="18" fill="#08080a" stroke="#3c3c46" stroke-width="3"/>
  <path d="M427 419l13 9-13 9z" fill="#ececec" opacity=".8"/>

  <!-- Справа: скачать и переслать. -->
  <g filter="url(#g4lift)">
    <rect x="600" y="382" width="186" height="46" rx="13" fill="url(#g4cta)"/>
  </g>
  <path d="M624 396v14 M618 404l6 6 6-6 M616 414h16" fill="none" stroke="#08080a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="646" y="400" width="112" height="10" rx="5" fill="#08080a" opacity=".55"/>
  <rect x="600" y="440" width="186" height="46" rx="13" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  <path d="M630 454l-12 9 12 9 M618 463h14c6 0 10 4 10 10" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
  <rect x="652" y="458" width="96" height="10" rx="5" fill="#9a9a9a" opacity=".4"/>
</svg>
