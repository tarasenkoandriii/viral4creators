<!-- Кадр hero страницы поздравлений (этап H ТЗ docs-tz/TZ-Greeting-2.0-Adaptive-Persona-Landing.md §5.2–§5.3).
     Не повторяет ни одну из четырёх схем «Как это работает»: там четыре
     момента по очереди, здесь весь путь одним кадром и тремя планами —
     дальний: бриф (повод и получатель); средний: «Характер ролика»;
     передний: готовый вертикальный ролик. Статичный файл, а не кадр из
     витрины: лица из пользовательских роликов на рекламном первом экране
     требуют отдельного согласия (§5.2). Ни букв, ни цифр, ни людей —
     картинка одна на пять локалей. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="hgscene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3358"/>
      <stop offset=".62" stop-color="#1a1d2e"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="hgcta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8098ff"/>
      <stop offset="1" stop-color="#5c7dff"/>
    </linearGradient>
    <linearGradient id="hgglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hgglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hgclip">
      <rect x="566" y="72" width="198" height="352" rx="18"/>
    </clipPath>
    <filter id="hglift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".6"/>
    </filter>
  </defs>

  <ellipse cx="560" cy="250" rx="360" ry="280" fill="url(#hgglow)"/>

  <!-- Дальний план: бриф — поводы и получатель. -->
  <g filter="url(#hglift)">
    <rect x="40" y="40" width="360" height="300" rx="20" fill="#101014" stroke="#26262c" stroke-width="3"/>
  </g>
  <rect x="68" y="66" width="150" height="16" rx="6" fill="#ececec" opacity=".42"/>
  <g fill="#17171c" stroke="#34343c" stroke-width="3">
    <rect x="68" y="100" width="72" height="62" rx="12"/>
    <rect x="232" y="100" width="72" height="62" rx="12"/>
    <rect x="314" y="100" width="62" height="62" rx="12"/>
  </g>
  <rect x="150" y="100" width="72" height="62" rx="12" fill="#6c8cff" fill-opacity=".14" stroke="#6c8cff" stroke-width="3"/>
  <g fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".6">
    <path d="M90 144h28v-14h-28z M90 137h28 M97 130v-6 M111 130v-6"/>
    <path d="M254 124h28v20h-28z M252 118h32v6h-32z M268 118v26"/>
    <path d="M338 146v-20h14v20 M345 126c-4-5 0-9 0-12 3 4 5 8 0 12"/>
  </g>
  <g fill="none" stroke="#6c8cff" stroke-width="3">
    <circle cx="178" cy="131" r="11"/>
    <circle cx="194" cy="131" r="11"/>
  </g>
  <circle cx="92" cy="206" r="22" fill="#08080a" stroke="#3c3c46" stroke-width="3"/>
  <circle cx="92" cy="200" r="7" fill="#9a9a9a" opacity=".4"/>
  <path d="M78 218c3-7 8-9 14-9s11 2 14 9" fill="#9a9a9a" opacity=".4"/>
  <rect x="126" y="188" width="250" height="36" rx="10" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="142" y="200" width="100" height="12" rx="6" fill="#9a9a9a" opacity=".42"/>
  <rect x="68" y="244" width="308" height="70" rx="12" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="84" y="260" width="240" height="10" rx="5" fill="#9a9a9a" opacity=".28"/>
  <rect x="84" y="280" width="180" height="10" rx="5" fill="#9a9a9a" opacity=".28"/>

  <!-- Средний план: «Характер ролика», подстроенный под повод. -->
  <g filter="url(#hglift)">
    <rect x="252" y="236" width="300" height="264" rx="20" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  </g>
  <rect x="252" y="236" width="300" height="60" rx="20" fill="url(#hgglass)"/>
  <rect x="278" y="258" width="130" height="14" rx="6" fill="#ececec" opacity=".42"/>
  <g fill="#6c8cff" fill-opacity=".14" stroke="#6c8cff" stroke-opacity=".6" stroke-width="2.5">
    <rect x="278" y="284" width="70" height="22" rx="11"/>
    <rect x="354" y="284" width="56" height="22" rx="11"/>
    <rect x="416" y="284" width="80" height="22" rx="11"/>
  </g>
  <g fill="#101014" stroke="#30303a" stroke-width="3">
    <rect x="278" y="320" width="248" height="38" rx="10"/>
    <rect x="278" y="366" width="248" height="38" rx="10"/>
    <rect x="278" y="412" width="248" height="38" rx="10"/>
  </g>
  <g fill="none" stroke="#6c8cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 339h3 M299 332v14 M305 328v22 M311 334v10 M317 339h3"/>
    <path d="M298 396v-18l13-3v17 M298 396a4 3 0 1 1-1-.2 M311 392a4 3 0 1 1-1-.2"/>
    <path d="M292 426h10v14h-10z M306 426h10v14h-10z"/>
  </g>
  <g fill="#9a9a9a" opacity=".42">
    <rect x="334" y="334" width="96" height="10" rx="5"/>
    <rect x="334" y="380" width="80" height="10" rx="5"/>
    <rect x="334" y="426" width="104" height="10" rx="5"/>
  </g>
  <g fill="#08080a" stroke="#3c3c46" stroke-width="2.5">
    <rect x="452" y="329" width="62" height="20" rx="10"/>
    <rect x="452" y="375" width="62" height="20" rx="10"/>
    <rect x="452" y="421" width="62" height="20" rx="10"/>
  </g>
  <rect x="278" y="462" width="140" height="24" rx="9" fill="url(#hgcta)"/>

  <!-- Связь планов: выбранный повод задаёт характер ролика. Характер и
       ролик стоят вплотную — вторая выноска была бы лишней. -->
  <g stroke="#6c8cff" stroke-width="4" opacity=".9" fill="none">
    <path d="M222 162C222 200 230 214 252 250"/>
  </g>
  <g fill="#6c8cff">
    <circle cx="222" cy="162" r="7"/>
  </g>

  <!-- Передний план: готовый ролик 9:16. -->
  <g filter="url(#hglift)">
    <rect x="554" y="60" width="222" height="440" rx="28" fill="#17171c" stroke="#33333a" stroke-width="3"/>
  </g>
  <rect x="566" y="72" width="198" height="352" rx="18" fill="url(#hgscene)"/>
  <g clip-path="url(#hgclip)">
    <g fill="#6c8cff">
      <rect x="590" y="96" width="8" height="4" rx="2" transform="rotate(30 594 98)"/>
      <rect x="650" y="86" width="8" height="4" rx="2" transform="rotate(-20 654 88)"/>
      <rect x="724" y="104" width="8" height="4" rx="2" transform="rotate(45 728 106)"/>
      <circle cx="612" cy="132" r="3"/>
      <circle cx="742" cy="140" r="3"/>
    </g>
    <g fill="#ececec" opacity=".55">
      <rect x="694" y="92" width="7" height="3.5" rx="1.75" transform="rotate(60 697 94)"/>
      <circle cx="584" cy="166" r="2.5"/>
      <circle cx="708" cy="126" r="2.5"/>
    </g>
    <g fill="none" stroke="#8098ff" stroke-width="3.5">
      <ellipse cx="636" cy="196" rx="25" ry="31"/>
      <ellipse cx="690" cy="184" rx="25" ry="31"/>
      <path d="M636 227c-4 24 12 44 27 62 M690 215c2 28-12 50-27 74"/>
    </g>
    <ellipse cx="628" cy="186" rx="6" ry="9" fill="#ffffff" opacity=".14"/>
    <ellipse cx="682" cy="174" rx="6" ry="9" fill="#ffffff" opacity=".14"/>
    <path d="M566 356h198" stroke="#3c3c46" stroke-width="3"/>
    <path d="M630 356v-34h74v34 M630 334h74" fill="none" stroke="#ececec" stroke-width="3" opacity=".45"/>
    <path d="M667 322v-14 M667 308c-5-6 0-11 0-14 4 5 6 9 0 14" fill="none" stroke="#6c8cff" stroke-width="3" stroke-linecap="round"/>
    <rect x="594" y="376" width="142" height="10" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="614" y="394" width="102" height="10" rx="5" fill="#ffffff" opacity=".55"/>
  </g>
  <rect x="576" y="442" width="178" height="6" rx="3" fill="#2a2a33"/>
  <rect x="576" y="442" width="110" height="6" rx="3" fill="#6c8cff"/>
  <circle cx="686" cy="445" r="7" fill="#ececec"/>
  <circle cx="665" cy="474" r="15" fill="#08080a" stroke="#3c3c46" stroke-width="3"/>
  <path d="M661 466l11 8-11 8z" fill="#ececec" opacity=".8"/>
</svg>
