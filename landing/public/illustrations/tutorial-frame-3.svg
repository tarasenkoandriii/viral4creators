<!-- Кадр 3 «Заполнили и нажали»: цикл — действие и следующий экран. Этап D. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202026"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8098ff"/>
      <stop offset="1" stop-color="#5c7dff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- Показывается ЦИКЛ, а не одиночное действие: заполнили, нажали —
       и справа уже въезжает следующий экран. -->
  <g filter="url(#lift)">
    <rect x="48" y="60" width="560" height="400" rx="20" fill="#101014" stroke="#26262c" stroke-width="3"/>
  </g>
  <path d="M48 106H608" stroke="#26262c" stroke-width="3"/>
  <circle cx="78" cy="83" r="6.5" fill="#9a9a9a" opacity=".35"/>
  <circle cx="100" cy="83" r="6.5" fill="#9a9a9a" opacity=".35"/>
  <circle cx="122" cy="83" r="6.5" fill="#9a9a9a" opacity=".35"/>
  <rect x="146" y="75" width="260" height="15" rx="7.5" fill="#9a9a9a" opacity=".16"/>

  <rect x="80" y="134" width="220" height="19" rx="6" fill="#ececec" opacity=".5"/>

  <!-- Заполненное поле: значение ярче, чем пустая подсказка соседа. -->
  <rect x="80" y="176" width="496" height="52" rx="12" fill="#08080a" stroke="#6c8cff" stroke-width="4"/>
  <rect x="102" y="195" width="230" height="15" rx="7.5" fill="#ececec" opacity=".78"/>
  <rect x="80" y="246" width="496" height="52" rx="12" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="102" y="265" width="150" height="14" rx="7" fill="#9a9a9a" opacity=".28"/>

  <!-- Нажатая кнопка: акцентная заливка, кольцо фокуса, курсор. -->
  <rect x="74" y="322" width="222" height="70" rx="20" fill="none" stroke="#6c8cff" stroke-width="6" opacity=".24"/>
  <rect x="80" y="328" width="210" height="58" rx="15" fill="url(#cta)" filter="url(#lift)"/>
  <rect x="146" y="350" width="78" height="15" rx="7.5" fill="#06060a" opacity=".8"/>
  <path d="M252 366v34l9-11 7 14 7-3-7-14 12-2z" fill="#ececec" stroke="#0b0b0d" stroke-width="3" stroke-linejoin="round"/>

  <rect x="80" y="414" width="300" height="12" rx="6" fill="#9a9a9a" opacity=".16"/>

  <!-- Стрелка к следующему экрану и он сам, уже въезжающий справа. -->
  <path d="M624 260h74" stroke="#6c8cff" stroke-width="6" stroke-linecap="round"/>
  <path d="M686 244l18 16-18 16" fill="none" stroke="#6c8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g opacity=".55" filter="url(#lift)">
    <rect x="726" y="108" width="150" height="304" rx="18" fill="#131317" stroke="#2d2d35" stroke-width="3"/>
  </g>
  <rect x="750" y="140" width="100" height="16" rx="8" fill="#9a9a9a" opacity=".22"/>
  <rect x="750" y="176" width="126" height="44" rx="11" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="750" y="234" width="126" height="44" rx="11" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="750" y="298" width="96" height="40" rx="11" fill="#2a2a33"/>
</svg>
