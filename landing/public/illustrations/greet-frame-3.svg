<!-- Кадр 3 «Сценарий» (этап H ТЗ docs-tz/TZ-Greeting-2.0-Adaptive-Persona-Landing.md §5.3).
     Раскадровка: сцены стопкой, у каждой миниатюра и реплика; одна
     реплика открыта на правку (курсор), справа — «собрать заново».
     Правка руками до генерации — правда после этапа C. Ни букв, ни
     цифр: номера сцен — точки. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="g3thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f4a"/>
      <stop offset="1" stop-color="#16161c"/>
    </linearGradient>
    <radialGradient id="g3glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="g3lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <ellipse cx="400" cy="280" rx="360" ry="240" fill="url(#g3glow)"/>

  <!-- Дальний план: лист сценария. -->
  <g filter="url(#g3lift)">
    <rect x="60" y="40" width="560" height="460" rx="22" fill="#101014" stroke="#26262c" stroke-width="3"/>
  </g>
  <rect x="90" y="66" width="200" height="18" rx="6" fill="#ececec" opacity=".45"/>

  <!-- Сцена 1. -->
  <rect x="90" y="104" width="500" height="84" rx="14" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  <rect x="104" y="116" width="96" height="60" rx="9" fill="url(#g3thumb)"/>
  <path d="M116 166l20-20 14 12 10-8 26 16z" fill="#6c8cff" opacity=".35"/>
  <circle cx="176" cy="130" r="6" fill="#ececec" opacity=".35"/>
  <circle cx="222" cy="124" r="5" fill="#6c8cff"/>
  <rect x="236" y="120" width="220" height="10" rx="5" fill="#9a9a9a" opacity=".45"/>
  <rect x="222" y="142" width="330" height="10" rx="5" fill="#9a9a9a" opacity=".26"/>
  <rect x="222" y="160" width="260" height="10" rx="5" fill="#9a9a9a" opacity=".26"/>

  <!-- Сцена 2 — открыта на правку. -->
  <g filter="url(#g3lift)">
    <rect x="78" y="204" width="524" height="116" rx="16" fill="#1b1b21" stroke="#6c8cff" stroke-width="3"/>
  </g>
  <rect x="94" y="220" width="116" height="84" rx="10" fill="url(#g3thumb)"/>
  <!-- Миниатюра: шары. -->
  <g fill="none" stroke="#6c8cff" stroke-width="3" opacity=".75">
    <ellipse cx="136" cy="250" rx="13" ry="16"/>
    <ellipse cx="164" cy="244" rx="13" ry="16"/>
    <path d="M136 266c-2 10 4 16 12 22 M164 260c0 12-6 18-16 28"/>
  </g>
  <circle cx="232" cy="230" r="5" fill="#6c8cff"/>
  <rect x="246" y="226" width="180" height="10" rx="5" fill="#9a9a9a" opacity=".45"/>
  <rect x="226" y="246" width="356" height="58" rx="10" fill="#08080a" stroke="#3c3c46" stroke-width="2.5"/>
  <rect x="240" y="258" width="300" height="10" rx="5" fill="#ececec" opacity=".42"/>
  <rect x="240" y="280" width="190" height="10" rx="5" fill="#ececec" opacity=".42"/>
  <rect x="434" y="275" width="3" height="20" rx="1.5" fill="#6c8cff"/>

  <!-- Сцена 3. -->
  <rect x="90" y="336" width="500" height="84" rx="14" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  <rect x="104" y="348" width="96" height="60" rx="9" fill="url(#g3thumb)"/>
  <path d="M136 396h32v-18h-32z M133 378h38v-6h-38z M152 372v24" fill="none" stroke="#6c8cff" stroke-width="3" opacity=".6"/>
  <circle cx="222" cy="356" r="5" fill="#6c8cff"/>
  <rect x="236" y="352" width="160" height="10" rx="5" fill="#9a9a9a" opacity=".45"/>
  <rect x="222" y="374" width="310" height="10" rx="5" fill="#9a9a9a" opacity=".26"/>
  <rect x="222" y="392" width="220" height="10" rx="5" fill="#9a9a9a" opacity=".26"/>

  <rect x="90" y="440" width="500" height="36" rx="11" fill="none" stroke="#30303a" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M340 452v12 M334 458h12" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" opacity=".5"/>

  <!-- Передний план справа: действия со сценарием. -->
  <g filter="url(#g3lift)">
    <rect x="648" y="150" width="152" height="240" rx="20" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  </g>
  <!-- Правка руками. -->
  <circle cx="724" cy="208" r="32" fill="#6c8cff" fill-opacity=".14" stroke="#6c8cff" stroke-width="3"/>
  <path d="M710 222l4-12 18-18 8 8-18 18z M726 198l8 8" fill="none" stroke="#6c8cff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Собрать заново. -->
  <circle cx="724" cy="300" r="32" fill="#08080a" stroke="#3c3c46" stroke-width="3"/>
  <path d="M738 300a14 14 0 1 1-4-10 M736 282v9h-9" fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
  <rect x="692" y="350" width="64" height="10" rx="5" fill="#9a9a9a" opacity=".3"/>

  <path d="M602 262C630 262 628 208 656 208" fill="none" stroke="#6c8cff" stroke-width="4" opacity=".9"/>
  <circle cx="602" cy="262" r="7" fill="#6c8cff"/>
</svg>
