<!-- Кадр 1 «Повод и бриф» (этап H ТЗ docs-tz/TZ-Greeting-2.0-Adaptive-Persona-Landing.md §5.3).
     Слева сетка поводов, один выбран; выноска ведёт к брифу справа:
     получатель, фото, язык, свои слова. Порядок как в мастере — сначала
     повод, потом всё остальное (§3.5). Ни букв, ни цифр: схема одна на
     пять локалей. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" role="img" aria-hidden="true" focusable="false">
  <rect width="840" height="540" fill="#08080a"/>
  <defs>
    <linearGradient id="g1cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8098ff"/>
      <stop offset="1" stop-color="#5c7dff"/>
    </linearGradient>
    <radialGradient id="g1glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="g1lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <ellipse cx="230" cy="250" rx="260" ry="220" fill="url(#g1glow)"/>

  <!-- Дальний план: сетка поводов. -->
  <g filter="url(#g1lift)">
    <rect x="44" y="64" width="380" height="408" rx="20" fill="#101014" stroke="#26262c" stroke-width="3"/>
  </g>
  <rect x="72" y="92" width="170" height="18" rx="6" fill="#ececec" opacity=".45"/>
  <rect x="72" y="122" width="250" height="11" rx="5.5" fill="#9a9a9a" opacity=".24"/>

  <!-- Плитки 3×3; крайняя справа в первом ряду выбрана — выноске к брифу
       не нужно пересекать соседние плитки. Значки — торт, кольца,
       звезда, дом, шар, подарок, свеча (деликатный повод), сердце, искра. -->
  <g stroke="#34343c" stroke-width="3" fill="#17171c">
    <rect x="72" y="156" width="98" height="90" rx="14"/>
    <rect x="184" y="156" width="98" height="90" rx="14"/>
    <rect x="72" y="262" width="98" height="90" rx="14"/>
    <rect x="184" y="262" width="98" height="90" rx="14"/>
    <rect x="296" y="262" width="98" height="90" rx="14"/>
    <rect x="72" y="368" width="98" height="78" rx="14"/>
    <rect x="184" y="368" width="98" height="78" rx="14"/>
    <rect x="296" y="368" width="98" height="78" rx="14"/>
  </g>
  <rect x="296" y="156" width="98" height="90" rx="14" fill="#6c8cff" fill-opacity=".14" stroke="#6c8cff" stroke-width="3"/>

  <g fill="none" stroke="#9a9a9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
    <!-- торт -->
    <path d="M103 216h36v-18h-36z M103 207h36 M112 198v-8 M130 198v-8"/>
    <!-- звезда -->
    <path d="M233 184l6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z"/>
    <!-- дом -->
    <path d="M103 322v-20l18-14 18 14v20z M116 322v-11h10v11"/>
    <!-- шар -->
    <path d="M233 304c-11 0-18-9-18-19s8-17 18-17 18 7 18 17-7 19-18 19z M233 304l-3 8 M230 312c4 4-3 8 1 12"/>
    <!-- подарок -->
    <path d="M328 294h34v26h-34z M325 286h40v8h-40z M345 286v34 M345 286c-6-10-16-8-12-1 M345 286c6-10 16-8 12-1"/>
    <!-- свеча -->
    <path d="M114 424v-24h14v24 M121 400c-4-5 0-9 0-12 3 4 5 8 0 12"/>
    <!-- сердце -->
    <path d="M233 424c-12-8-18-14-18-21 0-5 4-9 9-9 4 0 7 2 9 5 2-3 5-5 9-5 5 0 9 4 9 9 0 7-6 13-18 21z"/>
    <!-- искра -->
    <path d="M345 394v30 M330 409h30 M335 399l20 20 M355 399l-20 20"/>
  </g>
  <!-- Выбранный повод — кольца, акцентом. -->
  <g fill="none" stroke="#6c8cff" stroke-width="3.5">
    <circle cx="335" cy="204" r="14"/>
    <circle cx="355" cy="204" r="14"/>
  </g>
  <circle cx="376" cy="172" r="9" fill="#6c8cff"/>
  <path d="M371.5 172l3 3 6-6" fill="none" stroke="#08080a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Выноска: выбранный повод открывает бриф. -->
  <path d="M394 201C424 201 422 150 452 150" fill="none" stroke="#6c8cff" stroke-width="4" opacity=".9"/>
  <circle cx="394" cy="201" r="7" fill="#6c8cff"/>

  <!-- Передний план: бриф. -->
  <g filter="url(#g1lift)">
    <rect x="452" y="96" width="348" height="356" rx="20" fill="#17171c" stroke="#30303a" stroke-width="3"/>
  </g>
  <!-- Получатель: фото-кружок и поле имени. -->
  <circle cx="500" cy="150" r="26" fill="#08080a" stroke="#3c3c46" stroke-width="3"/>
  <circle cx="500" cy="143" r="8" fill="#9a9a9a" opacity=".4"/>
  <path d="M484 164c3-8 9-11 16-11s13 3 16 11" fill="#9a9a9a" opacity=".4"/>
  <rect x="540" y="130" width="230" height="40" rx="10" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="556" y="144" width="110" height="12" rx="6" fill="#9a9a9a" opacity=".45"/>
  <rect x="664" y="141" width="3" height="18" rx="1.5" fill="#6c8cff"/>

  <!-- Язык: пять кнопок-точек, одна выбрана. -->
  <rect x="480" y="196" width="100" height="11" rx="5.5" fill="#9a9a9a" opacity=".28"/>
  <g fill="#08080a" stroke="#34343c" stroke-width="3">
    <rect x="480" y="218" width="50" height="30" rx="15"/>
    <rect x="588" y="218" width="50" height="30" rx="15"/>
    <rect x="642" y="218" width="50" height="30" rx="15"/>
    <rect x="696" y="218" width="50" height="30" rx="15"/>
  </g>
  <rect x="534" y="218" width="50" height="30" rx="15" fill="#6c8cff" fill-opacity=".18" stroke="#6c8cff" stroke-width="3"/>
  <g fill="#9a9a9a" opacity=".45">
    <rect x="494" y="229" width="22" height="8" rx="4"/>
    <rect x="602" y="229" width="22" height="8" rx="4"/>
    <rect x="656" y="229" width="22" height="8" rx="4"/>
    <rect x="710" y="229" width="22" height="8" rx="4"/>
  </g>
  <rect x="548" y="229" width="22" height="8" rx="4" fill="#6c8cff"/>

  <!-- Свои слова: многострочное поле. -->
  <rect x="480" y="272" width="130" height="11" rx="5.5" fill="#9a9a9a" opacity=".28"/>
  <rect x="480" y="294" width="290" height="84" rx="12" fill="#08080a" stroke="#34343c" stroke-width="3"/>
  <rect x="498" y="312" width="230" height="10" rx="5" fill="#9a9a9a" opacity=".3"/>
  <rect x="498" y="332" width="200" height="10" rx="5" fill="#9a9a9a" opacity=".3"/>
  <rect x="498" y="352" width="120" height="10" rx="5" fill="#9a9a9a" opacity=".3"/>

  <!-- Дальше. -->
  <rect x="610" y="398" width="160" height="38" rx="11" fill="url(#g1cta)"/>
  <path d="M682 411l8 6-8 6" fill="none" stroke="#08080a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
