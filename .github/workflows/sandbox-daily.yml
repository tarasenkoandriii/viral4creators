name: Sandbox daily QA
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-daily.yml"
permissions:
  contents: read
concurrency:
  group: sandbox-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sandbox
    env:
      SANDBOX_URL: ${{ github.event_name != 'pull_request' && vars.SANDBOX_URL || '' }}
      ASSIST_API_URL: https://assist-api.viral4creators.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      - name: Require deployed target
        if: github.event_name != 'pull_request'
        run: test -n "$SANDBOX_URL"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-qa-report
          path: |
            sandbox/playwright-report/
            sandbox/test-results/
          retention-days: 14
