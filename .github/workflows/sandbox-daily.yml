name: Sandbox daily QA
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "sandbox/**"
      - "frontend/src/lib/voice-*.ts"
      - "frontend/src/features/voice/useVoiceListening.ts"
      - "frontend/scripts/*voice*"
      - "frontend/scripts/fixtures/voice/**"
      - "frontend/package*.json"
      - ".github/workflows/sandbox-daily.yml"
permissions:
  contents: read
concurrency:
  group: sandbox-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sandbox
    env:
      SANDBOX_URL: ${{ github.event_name != 'pull_request' && vars.SANDBOX_URL || '' }}
      ASSIST_SANDBOX_PUBLIC_KEY: ${{ github.event_name != 'pull_request' && vars.ASSIST_SANDBOX_PUBLIC_KEY || '' }}
      ASSIST_API_URL: https://assist-api.viral4creators.app
      ASSIST_SANDBOX_VOICE_QA: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      - name: Require deployed target
        if: github.event_name != 'pull_request'
        run: test -n "$SANDBOX_URL"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-qa-report
          path: |
            sandbox/playwright-report/
            sandbox/test-results/
          retention-days: 14

  voice-segmentation:
    name: Local voice regression — speech, noise, device lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pinned model assets
        run: node scripts/prepare-voice-vad.mjs
      - name: Real model — synthetic speech and noise
        run: npm run test:voice-neural
      - name: Device cleanup and late initialization
        run: npm run test:voice-runtime

  voice-semantics:
    name: Paid Soniox command semantics — clean, noise, silence
    if: github.event_name != 'pull_request' && vars.SONIOX_SEMANTIC_QA_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Require protected provider credentials
        env:
          SONIOX_API_KEY: ${{ secrets.SONIOX_QA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_QA_API_KEY }}
        run: |
          node - <<'JS'
          const valid = key => !!key?.trim() && !key.includes('[SENSITIVE]');
          if (!valid(process.env.SONIOX_API_KEY) || !valid(process.env.GEMINI_API_KEY)) {
            console.error('Semantic QA enabled but provider credentials are missing.');
            process.exit(1);
          }
          JS
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audio conversion dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: TTS, STT and command parser — synthetic data, one dollar ceiling
        env:
          SONIOX_API_KEY: ${{ secrets.SONIOX_QA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_QA_API_KEY }}
        run: |
          # Keep raw SDK logs outside the uploaded evidence.
          if ! npm run eval:voice-control -- --apply --max-usd=1 --out=voice-control-eval > "$RUNNER_TEMP/voice-semantic.log" 2>&1; then
            echo 'Semantic QA failed or stopped; inspect the structured acceptance report.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soniox-semantic-acceptance
          path: backend/voice-control-eval/summary.json
          retention-days: 14
          if-no-files-found: warn
