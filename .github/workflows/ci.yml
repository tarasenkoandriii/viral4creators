# CI — то, что раньше прогонялось руками на каждом этапе (ТЗ §27, этап 33).
#
# Зачем это появилось так поздно: 442 теста, 17 написанных вручную
# миграций и `sync-legal --check`, специально сделанный «для CI»,
# существовали, но запускал их только человек и только когда вспоминал.
#
# Главное, чего не может песочница разработки и может CI: **сеть до
# binaries.prisma.sh**. Поэтому здесь Prisma-клиент генерируется
# по-настоящему, а миграции накатываются на живой Postgres и сверяются со
# схемой. Именно это все прошлые этапы приходилось откладывать до стенда.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: смысла проверять
  # уже устаревший коммит нет.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Версия Node — ОДНА, в `.nvmrc` (24 — как `engines.node` пакетов и Node
# Vercel-проектов). Раньше здесь стояло '20' при сборке прода на 24: зелёный
# CI был не про ту сборку. Числовой `node-version:` в .github запрещён
# проверкой scripts/check-node-version.mjs (джоба «репозиторий»).

jobs:
  # Какие джобы запускать: только те, чьи папки (и зависимости) изменились
  # с последнего УСПЕШНОГО прогона на ветке — scripts/ci-changes.mjs.
  # Приватный репозиторий платит минутами Actions, полный прогон ≈28 мин.
  changes:
    name: что изменилось
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      sites_backend: ${{ steps.f.outputs.sites_backend }}
      assist: ${{ steps.f.outputs.assist }}
      widget: ${{ steps.f.outputs.widget }}
      assist_integrations: ${{ steps.f.outputs.assist_integrations }}
      sites_landing: ${{ steps.f.outputs.sites_landing }}
      frontend: ${{ steps.f.outputs.frontend }}
      admin: ${{ steps.f.outputs.admin }}
      landing: ${{ steps.f.outputs.landing }}
      live_login_relay: ${{ steps.f.outputs.live_login_relay }}
      browser_worker: ${{ steps.f.outputs.browser_worker }}
      next_apps: ${{ steps.f.outputs.next_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - id: f
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  backend:
    name: backend — тесты, типы, линт
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      # Настоящий Postgres той же мажорной версии, что в docker-compose и
      # в Supabase: миграции обязаны проверяться на том, на чём поедут.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viral4creators
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viral4creators
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/viral4creators

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `postinstall` сам зовёт `prisma generate` — в CI это работает,
      # в песочнице нет, и отсюда все «Property 'x' does not exist on
      # type 'PrismaService'» в локальном tsc.
      - run: npm ci
        working-directory: backend
      # `npm audit` на высоких (этап 53, В-6.17): TODO вёл 14 предупреждений
      # руками, и новое высокое никто не заметил бы до следующего аудита.
      # Пока `continue-on-error` — известные высокие закрываются мажорными
      # обновлениями (I-Б.5), и красить весь CI ими до того дня нечестно;
      # шаг виден в логе и станет обязательным вместе с обновлением.
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: backend

      - name: prisma validate
        run: npx prisma validate
        working-directory: backend

      - name: миграции накатываются на чистый Postgres 16
        run: npx prisma migrate deploy
        working-directory: backend

      # Самая ценная проверка всего файла. Миграции написаны РУКАМИ (см.
      # doc/TELEGRAM-ADMIN.md §5), поэтому схема и миграции могут молча
      # разойтись: правку в schema.prisma легко забыть перенести в SQL, и
      # на проде это всплывёт как «колонки нет». Diff между базой, куда
      # накатились миграции, и schema.prisma обязан быть пустым.
      # Флаги здесь именно такие, какие понимает Prisma 7: `--from-url` и
      # `--to-schema-datamodel` были УДАЛЕНЫ в седьмой версии, и шаг с
      # ними падал с «flag was removed» — то есть самая ценная проверка
      # в этом файле не работала вовсе (найдено на этапе 38). Источник
      # строки подключения — prisma.config.ts (там DIRECT_URL).
      - name: схема и миграции не разошлись
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
        working-directory: backend

      # Единственное место, где проверяются типы ТЕСТОВ. Раньше их
      # заодно компилировал `nest build` при деплое — и ошибка в спеке
      # роняла прод-сборку на Vercel (так и случилось: лишний аргумент
      # конструктора в `greeting-video.service.spec.ts`). Сборка теперь
      # идёт по `tsconfig.build.json` и спеков не видит, а `jest` гоняет
      # их с `diagnostics: false` — то есть без этого шага ошибка типов
      # в тесте не всплыла бы нигде. Конфиг здесь БЕЗ `-p`, то есть
      # корневой `tsconfig.json`: он покрывает `src`, `test` и
      # `scripts` целиком.
      - name: типы (включая тесты и скрипты)
        run: npx tsc --noEmit
        working-directory: backend

      - name: линт
        run: npx eslint "src/**/*.ts" --max-warnings 0
        working-directory: backend

      # `--json --outputFile` нужен не ради красоты: scripts/check-docs.mjs
      # берёт из этого отчёта число тестов. Статически его честно не
      # посчитать — `it.each` и тесты в циклах разворачиваются в рантайме.
      # Один прогон — и отчёт для check-docs, и пороги покрытия (этап 53,
      # В-6.16): раньше набор гонялся дважды подряд, ~35 лишних секунд на
      # каждый пуш. `--json --outputFile` и `--coverage` совместимы.
      #
      # Порог покрытия — НЕ на проект целиком (общий процент ничего не
      # говорит и провоцирует писать тесты ради процента), а на восемь
      # файлов (список — `coverageThreshold` в backend/package.json), где
      # непокрытая строка стоит денег или файлов:
      #  - common/blob-paths.ts — какие блобы удалять вместе с сессией;
      #    непокрытая ветка здесь = вечная утечка самых тяжёлых файлов
      #    (аудит 2026-09-06, §5: `postPathname` и `voiceoverPathname`
      #    имели ноль попаданий при 96 % по файлу);
      #  - common/ai-pricing.ts — прайс; потерянная ставка даёт
      #    «молчаливый ноль» в отчёте о деньгах;
      #  - common/spend-limits.ts — дневные потолки расхода;
      #  - modules/plan — кто и что вправе делать за деньги;
      #  - квоты SerpApi/YouTube и служебный канал (этап 49).
      - name: тесты и покрытие опасных файлов
        run: npx jest --ci --coverage --coverageReporters=text-summary --json --outputFile=jest-results.json --reporters=default --reporters=github-actions
        working-directory: backend
        env:
          # Гонка записи снимка поздравления на настоящем Postgres (C2
          # захода 8, greeting-snapshot-write.pg.spec.ts): база с миграциями
          # уже накатана шагом выше; без строки набор в CI проваливается.
          GREETING_SNAPSHOT_PG_URL: ${{ env.DATABASE_URL }}

      # Числа в документах разъезжались с реальностью на этапах 25, 28 и
      # 30 — каждый раз их правили руками. Теперь это проверка, и стоит
      # она здесь, а не в джобе `repo`, потому что ей нужен отчёт jest.
      # `--require-jest`: здесь отчёт jest обязан быть и быть честным
      # (success, ноль упавших, наборов = spec-файлов) — иначе падение, а не skip.
      - name: счётчики в документах совпадают с реальностью
        run: node scripts/check-docs.mjs --require-jest

  # Бэкенд клиентских сайтов (Э0 ИИ-помощника, ядро site-core общее с QA).
  # Свой проект и своя postgres-схема `sites` со своей историей миграций —
  # поэтому своя джоба и своя база, а не шаги в джобе backend.
  sites-backend:
    name: sites-backend — тесты, типы, линт, схема
    needs: changes
    if: needs.changes.outputs.sites_backend == 'true'
    runs-on: ubuntu-latest

    services:
      # pgvector, а не голый postgres:16: первая же миграция делает
      # CREATE EXTENSION vector (фрагменты знаний помощника). Мажорная
      # версия та же, что у Supabase и джобы backend.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sites
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `?schema=sites` — migrate кладёт таблицы и `_prisma_migrations` в
      # схему `sites`, как на проде (prisma.config.ts).
      SITES_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sites?schema=sites
      SITES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sites
      # Второй клиент Prisma (AssistPublicDb) — под логин-ролью в
      # assist_public; роль создаёт шаг после миграций, как владелец на
      # Supabase (doc/DEPLOYMENT.md, 6.4). Пароль — только для CI-базы.
      ASSIST_PUBLIC_DATABASE_URL: postgresql://assist_widget_ci:assist_widget_ci@localhost:5432/sites

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: sites-backend/package-lock.json

      # `postinstall` зовёт `prisma generate` — в CI сеть до
      # binaries.prisma.sh есть.
      - run: npm ci
        working-directory: sites-backend
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: sites-backend

      - name: prisma validate
        run: npx prisma validate
        working-directory: sites-backend

      # Схемы — до миграций, как на Supabase: там `extensions` уже есть
      # (pgvector живёт в ней), а `sites` создаём явно, чтобы шаг ниже
      # проверял ровно ту последовательность, что пойдёт на прод.
      - name: схемы sites и extensions
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/sites" -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA IF NOT EXISTS sites' \
            -c 'CREATE SCHEMA IF NOT EXISTS extensions'

      - name: миграции накатываются на чистый Postgres 16 + pgvector
        run: npx prisma migrate deploy
        working-directory: sites-backend

      # Логин-роль виджета — ровно тем же SQL, что владелец выполняет на
      # Supabase (doc/DEPLOYMENT.md, 6.4): NOLOGIN-роль assist_public уже
      # создана миграцией. Проверку прав делает assist-public-db.spec.ts.
      - name: логин-роль виджета в assist_public
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/sites" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE assist_widget_ci LOGIN PASSWORD 'assist_widget_ci' IN ROLE assist_public" \
            -c "ALTER ROLE assist_widget_ci SET search_path = sites, extensions"

      # Миграции написаны РУКАМИ — сверка базы со схемой обязана быть
      # пустой (тот же шаг, что у backend; флаги Prisma 7).
      - name: схема и миграции не разошлись
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
        working-directory: sites-backend

      - name: типы (включая тесты и prisma.config.ts)
        run: npx tsc --noEmit
        working-directory: sites-backend

      - name: линт
        run: npx eslint "src/**/*.ts" prisma.config.ts --max-warnings 0
        working-directory: sites-backend

      # Здесь же — приёмка изоляции на реальной базе
      # (src/prisma/assist-public-role.spec.ts): SELECT из assist_admin_*
      # под ролью assist_public падает. При CI=true без базы набор не
      # пропускается, а падает.
      - name: тесты (в том числе изоляция под assist_public)
        # github-actions — упавшие тесты видны аннотациями проверки (публичный
        # API без входа); workerIdleMemoryLimit в package.json — воркер jest
        # перезапускается, если после файла держит > 1 ГБ (набор вырос до
        # ~2850 тестов на одной базе).
        run: npx jest --ci --reporters=default --reporters=github-actions
        working-directory: sites-backend

      # Копии чистых модулей backend/ в sites-backend/src/shared совпадают
      # с источниками (решение Э0 «копия с проверкой»).
      - name: общие модули синхронны с backend
        run: node scripts/sync-sites-shared.mjs --check

      # Изоляция «Сайт»/«Админка», слой 2 (ТЗ помощника §4.3-бис): код
      # «Сайта» не импортирует assist-admin-* и наоборот, shared/ — не
      # импортирует modules/. Самотест — чтобы «нарушений нет» не значило
      # «проверка сломана».
      - name: граф зависимостей sites-backend (самотест и проверка)
        run: |
          node scripts/check-sites-import-graph.mjs --self-test
          node scripts/check-sites-import-graph.mjs

  assist:
    name: assist (TMA помощника) — типы, линт, тесты, сборка
    needs: changes
    if: needs.changes.outputs.assist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: assist/package-lock.json
      - run: npm ci
        working-directory: assist
      # Копия site-tma-kit в assist/src/kit совпадает с источником.
      - name: site-tma-kit синхронен
        run: node scripts/sync-site-tma-kit.mjs --check
      - name: типы
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: assist
      - name: типы проверочных скриптов
        run: npm run typecheck:scripts
        working-directory: assist
      - name: линт
        run: npm run lint
        working-directory: assist
      - name: unit-скрипты
        run: npm test
        working-directory: assist
      - name: сборка
        run: npx vite build
        working-directory: assist

  # Э2 ИИ-помощника: виджет на сайте заказчика (контракт /tmp/k/CONTRACT-E2.md,
  # пакет widget/): загрузчик (Shadow DOM, ≤ 12 КБ gzip) + iframe-чат
  # (Preact, ≤ 60 КБ gzip). Бюджет размера и запрет HTML-приёмников в
  # собранном загрузчике — scripts/size-budget.mjs (ТЗ §4.12).
  widget:
    name: widget (виджет помощника) — типы, линт, тесты, сборка, размер, e2e
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
        working-directory: widget
      # Строго, без continue-on-error — осознанно, в отличие от остальных
      # пакетов: с --omit=dev здесь только рантайм виджета (Preact), а он
      # исполняется на ЧУЖИХ сайтах заказчиков. Высокая уязвимость в нём —
      # повод остановиться, а не строка в логе.
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        working-directory: widget
      - name: типы
        run: npm run typecheck
        working-directory: widget
      - name: типы скриптов, e2e и конфигов
        run: npm run typecheck:scripts
        working-directory: widget
      - name: линт (в т.ч. запрет HTML-приёмников и eval)
        run: npm run lint
        working-directory: widget
      - name: unit-скрипты (зеркало brand.ts с sites-backend и др.)
        run: npm test
        working-directory: widget
      - name: сборка
        run: npm run build
        working-directory: widget
      - name: размерный бюджет (загрузчик ≤ 12 КБ, чат ≤ 60 КБ gzip)
        run: npm run size
        working-directory: widget
      # E2E — Chromium (Playwright); мобильные проекты — эмуляция вьюпорта,
      # не iOS Safari (живые устройства — владелец). Без условия «спеков нет —
      # пропуск»: пустой набор не должен выглядеть пройденной проверкой —
      # Playwright без тестов падает сам («No tests found»).
      - name: e2e (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        working-directory: widget

  # Э3 ИИ-помощника: интеграции виджета (контракт /tmp/k/CONTRACT-E3.md,
  # пакет assist-integrations/): npm-пакет `@v4c/assist-widget` (обёртка
  # загрузчика с CDN + серверные помощники подписи), плагин
  # WordPress/WooCommerce (PHP без зависимостей), шаблон GTM. Зеркала бренда
  # и общие векторы подписи вебхука целей — scripts/*.test.ts и тест PHP.
  assist-integrations:
    name: assist-integrations (npm, WordPress, GTM) — типы, тесты, сборка, PHP
    needs: changes
    if: needs.changes.outputs.assist_integrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: assist-integrations/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none
      - run: npm ci
        working-directory: assist-integrations
      - name: типы
        run: npm run typecheck
        working-directory: assist-integrations
      - name: unit-скрипты (зеркала бренда, векторы подписи, код вставки GTM)
        run: npm test
        working-directory: assist-integrations
      - name: сборка npm-пакета
        run: npm run build
        working-directory: assist-integrations
      - name: PHP — синтаксис (7.4 — нижняя версия плагина)
        run: npm run php:lint
        working-directory: assist-integrations
      - name: PHP — тесты плагина без WordPress
        run: npm run php:test
        working-directory: assist-integrations

  # Лендинг клиентских сайтов (Л0–Л3 ТЗ лендинга помощника). Свой
  # проект Next 14 со своими бюджетами (§9) — поэтому своя джоба, а не
  # строка матрицы `next-apps`: Lighthouse CI и axe есть только здесь.
  # Л2–Л3: проверки собранного сайта идут С ВИДЖЕТОМ — сборка указывает на
  # лабораторный стенд продукта (scripts/built/assist-stand.ts, :3011) с
  # настоящим загрузчиком из widget/dist; тесты сверяют копии типов и правил
  # с sites-backend/src (widget-config.ts, landing-types.ts — без npm ci бэкенда).
  sites-landing:
    name: sites-landing — типы, линт, тесты, сборка, e2e виджета, Lighthouse, axe
    needs: changes
    if: needs.changes.outputs.sites_landing == 'true'
    runs-on: ubuntu-latest
    env:
      # Временный домен лендинга (doc/DEPLOYMENT.md §6.0): сборке нужен абсолютный адрес.
      SITE_URL: https://assist.viral4creators.app
      # Приманка: собранный клиентский бандл проверяется на отсутствие
      # этого значения (scripts/built/check-built.ts). Не секрет.
      PILOT_TELEGRAM_BOT_TOKEN: '000000:ci-sentinel-must-not-leak'
      PILOT_TELEGRAM_CHAT_ID: '-100000000000'
      # Лабораторный стенд продукта вместо живых assist-w/assist-api (секретов в CI нет).
      ASSIST_WIDGET_ORIGIN: http://localhost:3011
      ASSIST_API_ORIGIN: http://localhost:3011
      ASSIST_WIDGET_PK: pk_live_landingstand01
      ASSIST_BOT_USERNAME: assist_stand_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            sites-landing/package-lock.json
            widget/package-lock.json
      - run: npm ci
        working-directory: sites-landing
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: sites-landing
      - name: типы
        run: npx tsc --noEmit
        working-directory: sites-landing
      - name: линт
        run: npx next lint --max-warnings 0
        working-directory: sites-landing
      - name: unit-скрипты
        run: npm test
        working-directory: sites-landing
      # §14 Л0: прод-сборка без SITE_URL обязана падать — проверяем, что
      # падает именно на проверке адреса (а не на чём-то случайном).
      - name: сборка без SITE_URL падает
        run: |
          if SITE_URL= npx next build > no-site-url.log 2>&1; then
            echo "сборка без SITE_URL прошла — замок снят"; exit 1
          fi
          grep -q 'SITE_URL не задан' no-site-url.log
        working-directory: sites-landing
      - name: сборка
        run: npx next build
        working-directory: sites-landing
      - name: собранный HTML (SEO, реестр утверждений, виджет не в HTML, секреты не в бандле)
        run: npm run check:built
        working-directory: sites-landing
      - name: бюджет JS первой загрузки (≤ 110 КБ, /widget и /try ≤ 160 КБ gzip)
        run: npm run budget:js
        working-directory: sites-landing
      - name: виджет для стенда (настоящий загрузчик)
        run: npm ci && npm run build
        working-directory: widget
      # Chromium для axe и e2e — той же версии, что playwright-core в devDeps.
      - name: Chromium для axe
        run: npx playwright-core install --with-deps chromium
        working-directory: sites-landing
      - name: стенд продукта и сайт
        run: |
          npm run stand > stand.log 2>&1 &
          npx next start -p 3010 > next-start.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://localhost:3010/robots.txt http://localhost:3011/widget/v1/config
        working-directory: sites-landing
      - name: axe (WCAG 2.2 A/AA) и 360 px (+ состояния песочницы на стенде)
        run: npm run axe
        working-directory: sites-landing
      - name: e2e Л2–Л3 (живой виджет, preview, события, конфигуратор, черновик)
        run: npm run e2e:widget
        working-directory: sites-landing
      - name: e2e Л4–Л5 (песочница на моке стенда, безопасный рендер, sb_, отказы, код вставки)
        run: npm run e2e:sandbox
        working-directory: sites-landing
      # Тот же запущенный сервер; Chrome — системный на раннере.
      - name: Lighthouse CI (медиана 5 прогонов, бюджеты §9, с виджетом)
        run: npx lhci autorun --config=lighthouserc.cjs
        env:
          LHCI_BASE_URL: http://localhost:3010
        working-directory: sites-landing
      - name: отчёты Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-sites-landing
          path: sites-landing/.lighthouseci/reports
          if-no-files-found: ignore

  frontend:
    name: frontend (TMA) — типы, линт, unit-скрипты, сборка
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: frontend

      - name: типы
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend

      # Аудит волны A «Тонкой красной линии»: `tsconfig.json` включает
      # только `src`, а `tsx` типы НЕ проверяет — значит проверочные
      # скрипты в `scripts/` не проверялись ничем и успели отстать от
      # типов (фикстура `plan.test.ts` — на пять полей `PlanState`,
      # найдено уже отставшей). Тот же класс ошибки, что
      # `diagnostics: false` у ts-jest на бэкенде, из-за которого
      # однажды упала прод-сборка.
      - name: типы проверочных скриптов
        run: npm run typecheck:scripts
        working-directory: frontend

      - name: линт
        # Через npm-скрипт, а не своей строкой: у него есть
        # `--report-unused-disable-directives`, и расхождение означало,
        # что локальная проверка СТРОЖЕ CI — то есть зелёный CI ничего
        # не обещал про мёртвые `eslint-disable`.
        run: npm run lint
        working-directory: frontend

      # Тестового раннера во фронтенде нет — проверки живут скриптами
      # `npx tsx scripts/*.test.ts`. Запуск описан ОДИН раз, в
      # `frontend/package.json` как `npm test`: пока он существовал только
      # здесь, прогнать фронтенд-тесты локально было нечем, и они
      # проверялись только в CI (аудит 2026-09-06, §5).
      - name: unit-скрипты
        run: npm test
        working-directory: frontend

      - name: сборка
        run: npx vite build
        working-directory: frontend

  next-apps:
    name: ${{ matrix.app }} — типы и сборка
    needs: changes
    if: needs.changes.outputs.next_apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.next_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: ${{ matrix.app }}

      - name: типы
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: ${{ matrix.app }}

      # Этап 53 (В-6.11): две кодовые базы из четырёх не линтовались никогда
      # — у admin/ и landing/ не было ни конфигурации, ни скрипта.
      - name: линт
        run: npx next lint --max-warnings 0
        working-directory: ${{ matrix.app }}

      # У `landing/` появились первые тесты — до этого он проверялся
      # только типами, линтом и сборкой, то есть ни одна строка его
      # ПОВЕДЕНИЯ не проверялась вовсе (найдено при приёмке страницы
      # поздравлений). Схема как во фронтенде: чистые функции,
      # `node:assert` + `tsx`, без тест-раннера.
      #
      # `--if-present` — потому что шаг общий для всей матрицы и скрипта
      # `test` может не быть у нового приложения. У `admin/` он есть с
      # захода 7 (07.10.2026): `src/lib/*.test.ts` через свой `tsx`.
      - name: unit-скрипты
        run: npm run test --if-present
        working-directory: ${{ matrix.app }}

      - name: сборка
        run: npx next build
        working-directory: ${{ matrix.app }}

      # Ш5 (14): бюджет JS первой загрузки `landing/` (по образцу
      # `sites-landing` `budget:js`): потолки маршрутов с запасом ≈ 10 %,
      # превышение — отказ с разбором по чанкам. `--if-present` — у
      # `admin/` бюджета нет (шаг общий для матрицы).
      - name: бюджет JS первой загрузки
        run: npm run budget:js --if-present
        working-directory: ${{ matrix.app }}

      # Сборки выше — без NEXT_PUBLIC_ASSIST_WIDGET (legacy, как прод).
      # Чат в First Load JS how-it-works сборки `platform` (см.
      # landing/src/components/EmbeddedAssistant.tsx) бюджет legacy не
      # видит — второй прогон в режиме `platform` с тестовыми адресом и
      # ключом и её потолком (`--platform`, PLATFORM_ROUTE_BUDGET_KB).
      # Эти два шага — ПОСЛЕДНИЕ в джобе: сборка перезаписывает `.next`,
      # и всё, что проверяет сборку legacy, должно идти до них.
      - name: сборка platform (landing)
        if: matrix.app == 'landing'
        run: npx next build
        working-directory: landing
        env:
          NEXT_PUBLIC_ASSIST_WIDGET: platform
          NEXT_PUBLIC_ASSIST_WIDGET_SRC: https://w.example.com/v1/loader.js
          NEXT_PUBLIC_ASSIST_WIDGET_SITE_KEY: pk_live_abcdefghijklmnopqrstuvwx

      - name: бюджет JS первой загрузки, сборка platform (landing)
        if: matrix.app == 'landing'
        run: npm run budget:js -- --platform
        working-directory: landing

  # Реле живого входа (Dokploy, не Vercel). До Э-С Ш0 его тесты не
  # запускал никто, кроме человека: в CI реле не было вовсе. С Ш0.2 в нём
  # фильтр исходящего трафика браузера — копия backend/src/common
  # (scripts/sync-relay-shared.mjs), и расхождение копии ловится здесь.
  live-login-relay:
    name: live-login-relay — копии, типы, линт, тесты, сборка
    needs: changes
    if: needs.changes.outputs.live_login_relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: live-login-relay/package-lock.json
      - name: копии фильтра совпадают с backend/src/common
        run: node scripts/sync-relay-shared.mjs --check
      - run: npm ci
        working-directory: live-login-relay
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: live-login-relay
      - name: линт
        run: npx eslint "src/**/*.ts" "test/**/*.ts" --max-warnings 0
        working-directory: live-login-relay
      - name: тесты
        run: npx jest --ci
        working-directory: live-login-relay
      - name: сборка (tsc, она же проверка типов src)
        run: npm run build
        working-directory: live-login-relay

  # Э-С Ш3: браузерный воркер (изолированный VPS, Docker; не Vercel и не
  # реле живого входа). Копии чистых модулей (фильтр исходящего трафика,
  # подпись, протокол очереди, конверт учёток, стоп-лист кликов) сверяются
  # с источниками; e2e — на настоящем Chromium Playwright той же версии,
  # что playwright-core пакета (только headless-оболочка).
  browser-worker:
    name: browser-worker — копии, типы, линт, unit, e2e Chromium
    needs: changes
    if: needs.changes.outputs.browser_worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: browser-worker/package-lock.json
      - name: копии общих модулей совпадают с источниками
        run: node scripts/sync-worker-shared.mjs --check
      - run: npm ci
        working-directory: browser-worker
      - name: npm audit (high)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
        working-directory: browser-worker
      - name: линт
        run: npx eslint "src/**/*.ts" "test/**/*.ts" --max-warnings 0
        working-directory: browser-worker
      - name: сборка (tsc, она же проверка типов src)
        run: npm run build
        working-directory: browser-worker
      - name: unit (очередь, подпись, аренда, фильтр трафика, стоп-лист, секреты)
        run: npx jest -c jest.config.js --ci
        working-directory: browser-worker
      - name: Chromium Playwright (headless-оболочка той же версии)
        run: npx playwright-core install --with-deps --only-shell chromium
        working-directory: browser-worker
      - name: e2e на настоящем Chromium (стенды, egress, обход за логином, стоп-лист)
        run: npx jest -c jest.e2e.config.js --ci --runInBand
        working-directory: browser-worker

  # Э-С Ш5: база знаний консультанта из кода генератора → знания тенанта
  # «viral4creators» в sites-backend (системный API знаний,
  # doc/DEPLOYMENT.md §6.23). Только пуш в ветку по умолчанию и только когда
  # менялись источники базы (правило backend: backend/ и словари лендинга и
  # мини-аппа). Сначала проверка утечек секретов и ПДн — она красит джобу
  # всегда; отправка — только с секретами репозитория (без них «пропущено»,
  # джоба зелёная, пока владелец не включил). Тот же текст сервер отвечает
  # `unchanged` — без новой версии знаний и без эмбеддингов.
  assist-knowledge-sync:
    name: знания консультанта → тенант платформы
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Аудит Ш5: токен джобе не нужен (кроме чтения кода) — без прав по
    # умолчанию репозитория; секреты — только в env одного шага.
    permissions:
      contents: read
    concurrency:
      group: assist-knowledge-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Повторный запуск СТАРОГО прогона (Re-run в Actions) отправил бы
      # тенанту базу знаний того коммита и откатил бы свежую. Отправляем,
      # только если коммит прогона — текущий HEAD ветки по умолчанию.
      # HEAD — `git ls-remote` по origin: checkout оставил в git-конфиге
      # стандартный GITHUB_TOKEN (contents: read), других токенов не нужно.
      # Ветку не удалось прочитать — сбой джобы, а не отправка вслепую.
      - name: прогон по текущему HEAD ветки по умолчанию?
        id: head
        env:
          RUN_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1) || head=""
          if [ -z "$head" ]; then
            echo "::error::не удалось прочитать HEAD ветки $DEFAULT_BRANCH — знания не отправлены"
            exit 1
          fi
          if [ "$head" = "$RUN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Пропуск синхронизации знаний: прогон для $RUN_SHA, а HEAD $DEFAULT_BRANCH — $head (повторный запуск старого прогона не отправляет старую базу знаний; свежую отправит прогон HEAD)."
          fi
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Скрипту не нужны ни Prisma, ни база: чистая функция от файлов репо.
      - run: npm ci --ignore-scripts
        if: steps.head.outputs.current == 'true'
        working-directory: backend
      # Без секретов — сухой прогон (проверка утечек), с ними — отправка.
      - name: синхронизация знаний (проверка утечек → отправка)
        if: steps.head.outputs.current == 'true'
        run: npm run -s assist:knowledge-sync -- --apply
        working-directory: backend
        env:
          # Аудит Ш5: база собирается с тем же флагом оплаты, что прод
          # (иначе тенант отвечал бы «оплата выключена» при включённой).
          PLANS_BILLING_ENABLED: ${{ vars.PLANS_BILLING_ENABLED }}
          SITES_BACKEND_URL: ${{ secrets.SITES_BACKEND_URL }}
          ASSIST_LANDING_SITE_ID: ${{ secrets.ASSIST_LANDING_SITE_ID }}
          ASSIST_KNOWLEDGE_API_KEY: ${{ secrets.ASSIST_KNOWLEDGE_API_KEY }}
          # Необязательно: документ локали ссылается на <лендинг>/<локаль>.
          LANDING_PUBLIC_URL: ${{ secrets.LANDING_PUBLIC_URL }}

  repo:
    name: репозиторий — юридические тексты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # doc/legal/*.md — единственный источник правды; сгенерированные
      # модули в frontend/ и landing/ обязаны ему соответствовать, а
      # версия — совпадать с TERMS_VERSION на бэкенде.
      - name: юридические тексты синхронны
        run: node scripts/sync-legal.mjs --check

      # Каждый Vercel-проект деплоится только при изменениях в своей папке
      # (scripts/vercel-ignore-build.sh): у всех стоит ignoreCommand, сам
      # скрипт проходит самотест на временном git-репозитории.
      - name: деплой только изменённых Vercel-проектов
        run: node scripts/check-vercel-ignore.mjs

      # Правила выбора джоб (scripts/ci-changes.mjs) и то, что у каждой
      # джобы есть условие. Здесь, а не в джобе backend: «репозиторий»
      # идёт на каждом коммите.
      # Версия Node в одном месте (.nvmrc) и совпадает с engines.node.
      - name: версия Node — одна (.nvmrc)
        run: node scripts/check-node-version.mjs

      - name: выбор джоб CI по изменённым папкам
        run: node scripts/ci-changes.mjs --self-test

      # Числа в документах — на каждом коммите (документы правятся и без
      # кода). Отчёта jest здесь нет: `--no-jest` пропускает счётчики тестов
      # с явным предупреждением — их сверяет тот же скрипт в джобе backend
      # (`--require-jest`), когда она идёт.
      - name: числа в документах (без счётчиков тестов)
        run: node scripts/check-docs.mjs --no-jest
